# Dry-run fixture: CI concludes red after review convergence because of an
# environmental failure outside the branch. The classified failure must reach
# the same explicit rerun-and-resume pause as inherited red, with the PR left
# draft and flip-ready unreached.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
pr__target: { host: "github.com", path: "example/repo", remote: "origin", branch: "fixture-branch" }
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 11, url: "https://github.com/example/repo/pull/11", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false}'
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 11 }
review__code: "0 findings"
review__seams: "0 findings"
review__simplify: "0 findings"
review__tests: "0 findings"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
validate__discover:
  gate: run
  argv: ["bun", "run", "validate"]
  reason: ""
validate__gate:
  ran: true
  argv: ["bun", "run", "validate"]
  exit_code: 0
  timed_out: false
  duration_ms: 1
  log: "validate-gate/gate.log"
  tail: ""
  quarantined: []
validate__validate:
  green: true
  red_cause: ""
  summary: "stub: full gate green"
ci-probe: '{"state":"red","detail":"hosted runner lost network (fail)"}'
ci-verdict: '{"state":"red","detail":"hosted runner lost network (fail)"}'
ci-pr-open: "pr-open: https://github.com/example/repo/pull/1 is still open."
ci-fix__implement:
  done: true
  green: false
  red_cause: environment
  summary: "stub: the hosted runner lost network; the branch cannot correct the runner environment"
ci-recheck__mode: '{"continuation":true}'
ci-recheck__scope:
  # light mode; zero delta
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 11 }
ci-recheck__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no delta; prior report stands"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
ci-recheck__publish:
  ready: true
  action: none
  findings_summary: "stub: no delta; prior report stands"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
fix-ci-probe: '{"state":"red","detail":"hosted runner lost network (fail)"}'
attention-ci-probe: '{"state":"red","detail":"hosted runner lost network (fail)"}'
# The repository this branch's pull requests belong to. Stubbed because the
# node is deterministic and resolves from git's push configuration, which a
# fixture checkout does not have.
impl__pr-target:
  repo: "example/repo"
  reason: ""
fixture:
  expect: paused
  reached: [review__synthesize, gate-validated, ci-verdict, ci-fix__assert-changed, gate-ci-fix, ci-recheck__synthesize, ci-round-result, fix-ci-probe, ci-attention-route, attention-ci-probe]
  resolved-text-contains:
    attention-ci-pause: "Pull request #11 needs an operator. CI remains non-green after Archon classified the failure as environment: hosted runner lost network (fail) — Re-run the failing check, then resume this run."
exec-code: true
