name: archon-validate
description: |
  Discover and run the project's own checks — types, lint, tests, build,
  whatever the repository itself defines — and report a structured verdict.
  Judges nothing and fixes nothing: it runs what the project declares and
  tells the truth about the result.

  Use when: the current state of the checkout needs a validation verdict —
  "run the checks", "is this green", "validate this".
  NOT for: fixing failures (implement) or reviewing code (review).

model: medium

inputs:
  scope:
    default: ""
    description: >-
      Optional narrowing — a package, directory, or named check to focus on.
      Empty means the project's full applicable gate.

  comparison:
    default: ""
    description: >-
      Optional path to a composition request JSON: pinned original_base/base/head,
      change/base_changes, merge method and the project check argv/environment identity.
      Runs that exact gate on separate and composed trees without an agent.

returns: result
outcome_field: green

nodes:
  - id: mode
    script: mode
    runtime: bun
    with:
      comparison: "$INPUTS.comparison"
    output_format:
      type: object
      properties:
        comparison: { type: boolean }
      required: [comparison]

  - id: compare
    script: compare
    runtime: bun
    always_run: true
    depends_on: [mode]
    when: "$mode.output.comparison == true"
    with:
      comparison: "$INPUTS.comparison"
    output_format: &composition_verdict
      type: object
      properties:
        green: { type: boolean }
        red_cause:
          type: string
          enum: [introduced, inherited, environment, interaction, incomplete, deliberate, ""]
        summary: { type: string }
        evidence:
          anyOf:
            - type: "null"
            - type: object
              properties:
                type: { type: string, enum: [archon_artifact] }
                run_id: { type: string }
                path: { type: string }
              required: [type, run_id, path]
      required: [green, red_cause, summary, evidence]

  - id: discover
    command: validate-discover
    depends_on: [mode]
    when: "$mode.output.comparison == false"
    always_run: true
    output_format:
      type: object
      properties:
        gate:
          type: string
          enum: [run, none_defined, unrunnable]
        argv:
          type: array
          items: { type: string }
        reason:
          type: string
      required: [gate, argv, reason]

  # The project's gate runs here, not in an agent's shell: an agent's command cap
  # or turn end would cut a long gate off and turn a healthy change `incomplete`.
  - id: gate
    script: gate
    runtime: bun
    depends_on: [discover]
    always_run: true
    # Backstop only, above GATE_DEADLINE_MS in .shared/gate.ts: the script's own
    # deadline is what lets it restore quarantined files before it returns.
    timeout: 3000000
    with:
      discovery: "$discover.output"
    output_format:
      type: object
      properties:
        ran: { type: boolean }
        argv:
          type: array
          items: { type: string }
        exit_code:
          anyOf:
            - type: "null"
            - type: integer
        timed_out: { type: boolean }
        duration_ms: { type: number }
        log: { type: string }
        tail: { type: string }
        quarantined:
          type: array
          items: { type: string }
        error: { type: string }
      required: [ran, argv, exit_code, timed_out, duration_ms, log, tail, quarantined, error]

  - id: validate
    command: validate
    depends_on: [discover, gate]
    always_run: true
    with:
      discovery: "$discover.output"
      gate: "$gate.output"
    output_format:
      type: object
      properties:
        green:
          type: boolean
        # Why the verdict is not green: a failing check's cause, or
        # `incomplete` when the checks did not all run. Carries the empty string
        # when the gate is green, for the same reason implement's does:
        # OpenAI strict mode rejects a schema whose `required` omits a declared
        # property, so the absent form lives in the enum.
        red_cause:
          type: string
          enum: [introduced, inherited, environment, incomplete, deliberate, ""]
        summary:
          type: string
      required: [green, red_cause, summary]

  - id: result
    script: result
    runtime: bun
    depends_on: [compare, gate, validate]
    trigger_rule: none_failed_min_one_success
    with:
      comparison: { from: "$compare.output", if_skipped: null }
      validation: { from: "$validate.output", if_skipped: null }
      discovery: { from: "$discover.output", if_skipped: null }
      gate: { from: "$gate.output", if_skipped: null }
    output_type: validation
    output_format: *composition_verdict
